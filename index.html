<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Light in the Hallway</title>
<style>
  :root{
    --bg:#1a1816; /* Глубокий теплый серо-коричневый */
    --bg2:#2b2521; 
    --card:#362e28;
    --accent:#d4af37; /* Золото */
    --accent2:#a68b2c;
    --text:#fdfbf7; /* Теплый белый */
    --muted:#a89f91;
    --glow:rgba(212,175,55,.25);
  }
  
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  *{box-sizing:border-box;margin:0;padding:0}
  
  body{
    font-family: 'Georgia', 'Times New Roman', serif; 
    background: radial-gradient(circle at 50% 0%,var(--bg2) 0%,var(--bg) 70%);
    color:var(--text); min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding:24px 16px 48px; gap:24px;
    width: 100%; max-width: 100vw; overflow-x: hidden;
    -webkit-user-select: none; user-select: none; line-height: 1.5;
  }

  .lang { 
    align-self: flex-end; 
    display:flex; 
    gap:6px; 
    background:var(--card); 
    padding:4px; 
    border-radius:4px; 
    border:1px solid rgba(212,175,55,.3); 
  }
  .lang button { background:transparent; border:none; color:var(--muted); padding:6px 16px; border-radius:2px; font-weight:700; font-size:13px; cursor:pointer; transition:all .3s ease; font-family: system-ui, sans-serif; }
  .lang button.active { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#1a1816; box-shadow:0 4px 14px var(--glow); }

  .album { text-align:center; display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; max-width:600px; margin-top: 20px;}
  .album__cover { width:min(280px,72vw); aspect-ratio:1/1; border-radius:8px; object-fit:cover; box-shadow:0 20px 50px rgba(0,0,0,0.8); border:1px solid rgba(212,175,55,.3); pointer-events: none; }
  .album__title { font-size:clamp(26px,6vw,44px); font-weight:normal; letter-spacing:.02em; color: #fff; text-transform: uppercase; line-height: 1.1; }
  .album__sub { color:var(--accent); font-size:14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; font-family: system-ui, sans-serif; }

  .album__announce {
    max-width: 540px;
    font-size: 14px;
    color: var(--muted);
    font-style: italic;
    line-height: 1.6;
    margin: 10px 0;
    padding: 15px 20px;
    border-top: 1px solid rgba(212,175,55,.2);
    border-bottom: 1px solid rgba(212,175,55,.2);
    text-align: center;
  }

  .carousel { width:100%; max-width:960px; display:flex; gap:20px; overflow-x:auto; padding:10px 8px 20px; scroll-snap-type:x mandatory; scrollbar-width:thin; scrollbar-color:var(--accent) transparent; }
  .carousel::-webkit-scrollbar { height:6px; }
  .carousel::-webkit-scrollbar-thumb { background:var(--accent); border-radius:2px; }
  
  .track { flex:0 0 auto; width:200px; scroll-snap-align:center; background:var(--card); border-radius:8px; padding:12px; cursor:pointer; transition:transform .2s, box-shadow .2s; border:1px solid rgba(255,255,255,.05); text-align:left; display: flex; flex-direction: column;}
  .track:hover { transform:translateY(-5px); box-shadow: 0 10px 25px var(--glow); border-color: rgba(212,175,55,.3); }
  .track.active { border:2px solid var(--accent); box-shadow:0 0 15px var(--glow); }
  
  .track__cover { width:100%; aspect-ratio:1/1; border-radius:4px; object-fit:cover; display:block; margin-bottom:12px; background:var(--bg2); pointer-events: none; flex-shrink: 0; }
  
  .track__num { font-size:11px; color:var(--accent); font-weight:800; letter-spacing:.1em; margin-bottom:6px; font-family: system-ui, sans-serif;}
  .track__name { font-size:15px; font-weight:bold; margin-bottom:4px; line-height: 1.2; color: #fff; }
  .track__desc { font-size:12px; color:var(--muted); line-height: 1.4; flex-grow: 1; font-style: italic; }

  .player { width:100%; max-width:600px; background:var(--card); border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:16px; box-shadow:0 15px 50px rgba(0,0,0,.8); border:1px solid rgba(212,175,55,.15); position: sticky; bottom: 10px; z-index: 10;}
  .player__now { display:flex; align-items:center; gap:16px; }
  .player__cover { width:70px; height:70px; border-radius:8px; object-fit:cover; background:var(--bg2); border:1px solid var(--accent); pointer-events: none; }
  .player__info { overflow:hidden; flex:1; }
  .player__title { font-weight:bold; font-size:16px; line-height:1.25; margin-bottom:2px; color: #fff;}
  .player__artist { color:var(--muted); font-size:13px; font-family: system-ui, sans-serif;}
  .player audio { width:100%; outline: none; }
  
  .player__nav { display:flex; justify-content:center; gap:16px; }
  .player__nav button { background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:#1a1816; padding:12px 24px; border-radius:4px; font-weight:800; font-size:14px; cursor:pointer; transition:filter 0.3s; text-transform: uppercase; letter-spacing: 1px; font-family: system-ui, sans-serif;}
  .player__nav button:hover { filter:brightness(1.2); }
</style>
</head>
<body>
<!-- Кнопка возврата на главную -->
<a href="https://warmlight-music.github.io/my-music/" class="back-to-main">
    ← Вернуться  
</a>

<style>
    .back-to-main {
        position: fixed;
        top: 20px; /* Опустили кнопку вниз, чтобы не мешать переключателю языка */
        left: 20px;
        background-color: #1a1512; /* Темный фон, как на скриншоте */
        color: #d4af37;
        padding: 10px 20px;
        border-radius: 30px;
        text-decoration: none;
        font-family: 'Georgia', serif;
        font-size: 14px;
        border: 1px solid #4a3b2f;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        transition: all 0.3s ease;
        z-index: 9999;
    }

    .back-to-main:hover {
        background-color: #d4af37;
        color: #1a1512;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
    }
    
    /* Для мобильных телефонов можно сделать ее чуть меньше */
    @media (max-width: 768px) {
        .back-to-main {
            top: 20px; /* На телефоне шапка может быть чуть меньше */
            left: 10px;
            padding: 8px 15px;
            font-size: 12px;
        }
    }
</style>
  <div class="lang" role="group" aria-label="Language">
    <button id="btnRu">RU</button>
    <button id="btnEn" class="active">EN</button>
  </div>

  <section class="album">
    <img class="album__cover" id="albumCover" src="cover.jpg" alt="Album Cover">
    <h1 class="album__title" id="albumTitle">A Light in the Hallway</h1>
    <p class="album__sub" id="albumSub">2026</p>
    
    <p class="album__announce" id="albumAnnounce">
      Seven heartfelt stories wrapped in the warm analog sound of 1970s Swedish pop. A musical journey from the morning spark of kindness to the quiet sanctuary of home, where the hallway light is always on for you.
    </p>
  </section>

  <div class="carousel" id="carousel"></div>

  <div class="player">
    <div class="player__now">
      <img class="player__cover" id="playerCover" src="cover.jpg" alt="Cover">
      <div class="player__info">
        <div class="player__title" id="playerTitle">Pick a track</div>
        <div class="player__artist" id="playerArtist">A Light in the Hallway</div>
      </div>
    </div>
    <audio id="audio" controls controlslist="nodownload" preload="none"></audio>
    <div class="player__nav">
      <button id="prevBtn">⏮ Prev</button>
      <button id="nextBtn">Next ⏭</button>
    </div>
  </div>

<script>
  const album = {
    titleEn: "A Light in the Hallway",
    titleRu: "Свет в прихожей",
    announceEn: "Seven heartfelt stories wrapped in the warm analog sound of 1970s Swedish pop. A musical journey from the morning spark of kindness to the quiet sanctuary of home, where the hallway light is always on for you.",
    announceRu: "Семь лирических историй в золотой эстетике скандинавской поп-музыки 1970-х. Музыкальное путешествие от утреннего импульса доброты к тихому покою родного дома, где для тебя всегда оставили включённым свет в прихожей.",
    tracks: [
      { id: 1, en: "Bridge of Light", ru: "Мостик из света" },
      { id: 2, en: "A Shoulder to Lean On", ru: "Родное плечо" },
      { id: 3, en: "Your \"Hello\"", ru: "Твоё «Алло»" },
      { id: 4, en: "More Than Being Right", ru: "Дороже правоты" },
      { id: 5, en: "With Newborn Strength", ru: "С новой силой" },
      { id: 6, en: "The Pie Recipe", ru: "Рецепт пирога" },
      { id: 7, en: "Where You Are Waited For", ru: "Там, где тебя ждут" }
    ]
  };

  let lang = 'en';
  let currentTrack = -1;

  const carousel    = document.getElementById('carousel');
  const audio       = document.getElementById('audio');
  const playerCover = document.getElementById('playerCover');
  const playerTitle = document.getElementById('playerTitle');
  const playerArtist= document.getElementById('playerArtist');
  const albumTitle  = document.getElementById('albumTitle');
  const albumSub    = document.getElementById('albumSub');
  const albumAnnounce = document.getElementById('albumAnnounce');
  const btnRu       = document.getElementById('btnRu');
  const btnEn       = document.getElementById('btnEn');

  const pad = (n) => String(n).padStart(2,'0');
  
  const coverPath = (id) => `covers/${pad(id)}.jpg`;
  const songPath  = (id) => `${lang}${pad(id)}.mp3`;
  
  const trackName = (t) => lang === 'ru' ? t.ru : t.en;

  function renderCarousel(){
    carousel.innerHTML = '';
    album.tracks.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'track' + (i === currentTrack ? ' active' : '');
      el.dataset.index = i;
      el.innerHTML = `
        <img class="track__cover" src="${coverPath(t.id)}" alt="${trackName(t)}">
        <div class="track__num">TRACK #${t.id}</div>
        <div class="track__name">${trackName(t)}</div>
      `;
      el.addEventListener('click', () => play(i));
      carousel.appendChild(el);
    });
  }

  function updateAlbumHeader() {
    albumTitle.textContent = lang === 'ru' ? album.titleRu : album.titleEn;
    albumAnnounce.textContent = lang === 'ru' ? album.announceRu : album.announceEn;
  }

  function play(i){
    if (i < 0) i = album.tracks.length - 1;
    if (i >= album.tracks.length) i = 0;

    currentTrack = i;
    const t = album.tracks[i];

    playerCover.src = coverPath(t.id);
    playerTitle.textContent = trackName(t);
    playerArtist.textContent = lang === 'ru' ? album.titleRu : album.titleEn;

    [...carousel.querySelectorAll('.track')].forEach((el, idx) => el.classList.toggle('active', idx === i));
    carousel.children[i]?.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});

    audio.src = songPath(t.id);
    audio.play().catch(()=>{});
  }

  function setLang(newLang){
    if (lang === newLang) return;
    
    const wasPlaying = !audio.paused;
    const time = audio.currentTime;

    lang = newLang;

    btnRu.classList.toggle('active', lang === 'ru');
    btnEn.classList.toggle('active', lang === 'en');
    document.documentElement.lang = lang;

    updateAlbumHeader(); 
    renderCarousel();
    
    document.getElementById('prevBtn').textContent = lang === 'en' ? '⏮ Prev' : '⏮ Пред';
    document.getElementById('nextBtn').textContent = lang === 'en' ? 'Next ⏭' : 'След ⏭';

    if (currentTrack >= 0){
      const t = album.tracks[currentTrack];
      
      playerCover.src = coverPath(t.id);
      playerTitle.textContent = trackName(t);
      playerArtist.textContent = lang === 'ru' ? album.titleRu : album.titleEn;
      
      audio.src = songPath(t.id);
      audio.currentTime = time; 
      
      if (wasPlaying) {
        audio.play().catch(()=>{}); 
      }
    } else {
      playerTitle.textContent = lang === 'en' ? 'Pick a track' : 'Выбери трек';
      playerArtist.textContent = lang === 'ru' ? album.titleRu : album.titleEn;
    }
  }

  btnRu.addEventListener('click', () => setLang('ru'));
  btnEn.addEventListener('click', () => setLang('en'));

  document.getElementById('prevBtn').onclick = () => play(currentTrack - 1);
  document.getElementById('nextBtn').onclick = () => play(currentTrack + 1);
  audio.addEventListener('ended', () => play(currentTrack + 1));

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());

  updateAlbumHeader();
  renderCarousel();
</script>
</body>
</html>
